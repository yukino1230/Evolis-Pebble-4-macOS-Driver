# ippeveprinter に読ませる、Evolis Pebble 4 の IPP Everywhere の属性(ipptool と同じ書き方)
# 受け付ける形式(PWG ラスタ、Apple ラスタ)は ippeveprinter が決める。解像度は 300dpi、sRGB 8bit / グレー 8bit。用紙は CR80 カード(横長、縁なし)だけ。PPD と同じく横長にする(縦長で広告すると、横長の PDF が回されずに右が切れる)

ATTR resolution pwg-raster-document-resolution-supported 300dpi
ATTR keyword pwg-raster-document-type-supported srgb_8,sgray_8
ATTR keyword pwg-raster-document-sheet-back normal
ATTR resolution printer-resolution-supported 300dpi
ATTR resolution printer-resolution-default 300dpi

ATTR keyword media-supported om_cr80_85.6x54mm
ATTR keyword media-default om_cr80_85.6x54mm
ATTR keyword media-ready om_cr80_85.6x54mm
# 印刷ダイアログは用紙を大きさ(media-col の media-size)で送ってくる。ippeveprinter はそれを
# media-size-supported と比べるので、これが無いとジョブが「指定されたオプションでプリントできません」で止まる
ATTR collection media-size-supported { MEMBER integer x-dimension 8560 MEMBER integer y-dimension 5400 }
ATTR collection media-col-database {
    MEMBER collection media-size { MEMBER integer x-dimension 8560 MEMBER integer y-dimension 5400 }
    MEMBER integer media-top-margin 0
    MEMBER integer media-bottom-margin 0
    MEMBER integer media-left-margin 0
    MEMBER integer media-right-margin 0
    MEMBER keyword media-size-name om_cr80_85.6x54mm
}
ATTR collection media-col-default {
    MEMBER collection media-size { MEMBER integer x-dimension 8560 MEMBER integer y-dimension 5400 }
    MEMBER integer media-top-margin 0
    MEMBER integer media-bottom-margin 0
    MEMBER integer media-left-margin 0
    MEMBER integer media-right-margin 0
    MEMBER keyword media-size-name om_cr80_85.6x54mm
}
ATTR collection media-col-ready {
    MEMBER collection media-size { MEMBER integer x-dimension 8560 MEMBER integer y-dimension 5400 }
    MEMBER integer media-top-margin 0
    MEMBER integer media-bottom-margin 0
    MEMBER integer media-left-margin 0
    MEMBER integer media-right-margin 0
    MEMBER keyword media-size-name om_cr80_85.6x54mm
}
ATTR integer media-top-margin-supported 0
ATTR integer media-bottom-margin-supported 0
ATTR integer media-left-margin-supported 0
ATTR integer media-right-margin-supported 0

ATTR keyword print-color-mode-supported color,monochrome
ATTR keyword print-color-mode-default color
ATTR keyword sides-supported one-sided
ATTR keyword sides-default one-sided
ATTR enum print-quality-supported 4
ATTR enum print-quality-default 4
ATTR enum orientation-requested-supported 3,4
ATTR enum orientation-requested-default 4
ATTR text printer-make-and-model "Evolis Pebble 4"
ATTR boolean color-supported true
ATTR integer pages-per-minute 1
ATTR integer pages-per-minute-color 1

# AirPrint (Apple ラスタ) で受け取るときの形式: 300dpi、sRGB 24bit / グレー 8bit
ATTR keyword urf-supported V1.4,W8,SRGB24,RS300,IS1,MT1
